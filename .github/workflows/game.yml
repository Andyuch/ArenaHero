name: game
on:
  push:
    branches: [arena/01a0bfc0-arenahero]
    paths: [.github/workflows/.trigger]
run-name: game g2
permissions:
  contents: write
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a0bfc0-arenahero
      - name: Policy probe
        run: |
          mkdir -p gh-out
          python3 - <<'EOF' | tee gh-out/policy.txt
          import socket
          for host, port in [("202.189.23.31", 1800), ("202.189.23.31", 843)]:
              try:
                  s = socket.create_connection((host, port), timeout=6)
                  s.sendall(b"<policy-file-request/>\x00")
                  s.settimeout(6)
                  data = s.recv(4096)
                  print(f"{host}:{port} POLICY_REPLY: {data[:300]!r}", flush=True)
                  s.close()
              except Exception as e:
                  print(f"{host}:{port} no-policy ({str(e)[:60]})", flush=True)
          EOF
      - name: Fetch client bits and ruffle
        run: |
          set -u
          mkdir -p gh-out/client/config gh-out/client/version
          cd gh-out/client
          curl -sS -L --max-time 90 -o Client.swf "https://raw.githubusercontent.com/RecTaoMee/RecTaoMee_Hero/master/Client/Client.swf" && echo "swf_bytes=$(wc -c < Client.swf)" >> ../g2diag.txt || echo "swf_FAIL" >> ../g2diag.txt
          for f in config/IP.xml config/System.xml index.htm version/config.txt crossdomain.xml; do
            mkdir -p "$(dirname "$f")"
            curl -sS -L --max-time 30 -o "$f" "https://raw.githubusercontent.com/RecTaoMee/RecTaoMee_Hero/master/Client/$f" && echo "$f OK" >> ../g2diag.txt || echo "$f FAIL" >> ../g2diag.txt
          done
          curl -sS -L --max-time 150 -o /tmp/ruffle.tgz "https://github.com/ruffle-rs/ruffle/releases/download/v0.6.0/ruffle-0.6.0-linux-x86_64.tar.gz" && echo ruffle_dl_ok >> ../g2diag.txt || echo ruffle_dl_fail >> ../g2diag.txt
          mkdir -p /tmp/rf && tar xzf /tmp/ruffle.tgz -C /tmp/rf
          R=$(find /tmp/rf -name ruffle -type f | head -1)
          echo "ruffle_bin=$R" >> ../g2diag.txt
          "$R" --version >> ../g2diag.txt 2>&1 || echo "ruffle_run_fail" >> ../g2diag.txt
          (which scrot xdotool || sudo apt-get install -y scrot xdotool 2>&1 | tail -1) >> ../g2diag.txt 2>&1
          cat ../g2diag.txt
      - name: Render test
        run: |
          set -u
          cd "$GITHUB_WORKSPACE/gh-out/client"
          cat > /tmp/run.sh <<'EOF'
          #!/bin/bash
          export LIBGL_ALWAYS_SOFTWARE=1
          R=$(find /tmp/rf -name ruffle -type f | head -1)
          "$R" --width 1012 --height 670 Client.swf > /tmp/ruffle.log 2>&1 &
          RPID=$!
          sleep 25; scrot /tmp/g2_shot1.png
          sleep 20; scrot /tmp/g2_shot2.png
          sleep 20; scrot /tmp/g2_shot3.png
          kill $RPID 2>/dev/null
          wait 2>/dev/null
          EOF
          chmod +x /tmp/run.sh
          timeout 110 xvfb-run -a -s "-screen 0 1280x900x24" /tmp/run.sh
          echo "xvfb_exit=$?" >> ../g2diag.txt
          cp /tmp/g2_shot*.png /tmp/ruffle.log ../ 2>/dev/null || true
          ls -la ../ | head -20
      - name: Push results
        if: always()
        run: |
          set -u
          git config user.name 'arena-agent'
          git config user.email 'arena-agent@local'
          git add gh-out/
          git commit -m 'game g2 results' || echo 'nothing to commit'
          git pull --rebase origin arena/01a0bfc0-arenahero || true
          git push origin HEAD:arena/01a0bfc0-arenahero
