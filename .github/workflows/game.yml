name: game
on:
  push:
    branches: [arena/01a0bfc0-arenahero]
    paths: [.github/workflows/.trigger]
run-name: game g6
permissions:
  contents: write
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a0bfc0-arenahero
      - name: Clone full client
        run: |
          git clone --depth 1 https://github.com/RecTaoMee/RecTaoMee_Hero.git /tmp/hero 2>&1 | tail -2
          du -sh /tmp/hero 2>/dev/null | tee gh-out/g6diag.txt
          ls /tmp/hero/Client | head -20 >> gh-out/g6diag.txt
      - name: Fetch ruffle
        run: |
          curl -sS -L --max-time 150 -o /tmp/ruffle.tgz "https://github.com/ruffle-rs/ruffle/releases/download/v0.6.0/ruffle-0.6.0-linux-x86_64.tar.gz" && echo ruffle_dl_ok >> gh-out/g6diag.txt || echo ruffle_dl_fail >> gh-out/g6diag.txt
          mkdir -p /tmp/rf && tar xzf /tmp/ruffle.tgz -C /tmp/rf
          echo "ruffle_bin=$(find /tmp/rf -name ruffle -type f | head -1)" >> gh-out/g6diag.txt
          sudo apt-get install -y libxkbcommon-x11-0 scrot xdotool fonts-noto-cjk mesa-vulkan-drivers 2>&1 | tail -1
      - name: Run client
        run: |
          cat > /tmp/run.sh <<'EOF'
          #!/bin/bash
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p $XDG_RUNTIME_DIR
          unset VK_ICD_FILENAMES
          cd /tmp/hero/Client
          R=$(find /tmp/rf -name ruffle -type f | head -1)
          "$R" -p low --width 1012 --height 670 Client.swf > /tmp/ruffle.log 2>&1 &
          RPID=$!
          sleep 30; scrot /tmp/g6_shot1.png
          sleep 30; scrot /tmp/g6_shot2.png
          sleep 30; scrot /tmp/g6_shot3.png
          sleep 30; scrot /tmp/g6_shot4.png
          sleep 30; scrot /tmp/g6_shot5.png
          kill $RPID 2>/dev/null
          wait 2>/dev/null
          EOF
          chmod +x /tmp/run.sh
          timeout 300 xvfb-run -a -s "-screen 0 1280x900x24" /tmp/run.sh
          echo "xvfb_exit=$?" >> gh-out/g6diag.txt
          cp /tmp/g6_shot*.png /tmp/ruffle.log gh-out/ 2>/dev/null || true
          ls -la gh-out/ | head -20
      - name: Push results
        if: always()
        run: |
          set -u
          git config user.name 'arena-agent'
          git config user.email 'arena-agent@local'
          git add gh-out/
          git commit -m 'game g6 results' || echo 'nothing to commit'
          git pull --rebase origin arena/01a0bfc0-arenahero || true
          git push origin HEAD:arena/01a0bfc0-arenahero
