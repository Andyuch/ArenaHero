name: game
on:
  push:
    branches: [arena/01a0bfc0-arenahero]
    paths: [.github/workflows/.trigger]
run-name: game g30
permissions:
  contents: write
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a0bfc0-arenahero
      - name: Clone full client
        run: |
          git clone --depth 1 https://github.com/RecTaoMee/RecTaoMee_Hero.git /tmp/hero 2>&1 | tail -1 || (sleep 15; git clone --depth 1 https://github.com/RecTaoMee/RecTaoMee_Hero.git /tmp/hero 2>&1 | tail -1)
          du -sh /tmp/hero 2>/dev/null | tee gh-out/g30diag.txt
          python3 - <<'PYEOF' | tee -a gh-out/g30diag.txt
          import struct
          rect = bytes([0x08, 0x00])
          body = rect + bytes([0x00,0x18, 0x01,0x00]) + bytes([0x44,0x11,0x08,0x00,0x00,0x00]) + bytes([0x40,0x00,0x00,0x00])
          swf = b'FWS' + bytes([10]) + struct.pack('<I', 8+len(body)) + body
          for n in [1,2,3,4]:
              open(f'/tmp/hero/Client/res/movie/movie_{n}.swf','wb').write(swf)
          print('stubs written:', len(swf), 'bytes each')
          PYEOF
          ls -la /tmp/hero/Client/res/movie/movie_*.swf | tee -a gh-out/g30diag.txt
          true
      - name: Fetch ruffle
        run: |
          for i in 1 2 3; do
            curl -sS -L --fail --max-time 150 -o /tmp/ruffle.tgz "https://github.com/ruffle-rs/ruffle/releases/download/v0.6.0/ruffle-0.6.0-linux-x86_64.tar.gz" && break || sleep 10
          done
          ls -la /tmp/ruffle.tgz 2>&1 | tee -a gh-out/g30diag.txt
          mkdir -p /tmp/rf && tar xzf /tmp/ruffle.tgz -C /tmp/rf 2>&1 | tail -2 | tee -a gh-out/g30diag.txt
          find /tmp/rf -name ruffle -type f 2>&1 | tee -a gh-out/g30diag.txt
          sudo apt-get install -y libxkbcommon-x11-0 scrot xdotool fonts-noto-cjk mesa-vulkan-drivers bzip2 libopenh264-7 2>&1 | tail -2 || (sleep 20; sudo apt-get install -y libxkbcommon-x11-0 scrot xdotool fonts-noto-cjk mesa-vulkan-drivers bzip2 libopenh264-7 2>&1 | tail -2)
          (which scrot; which xdotool) 2>&1 | tee -a gh-out/g30diag.txt
          ldconfig -p 2>/dev/null | grep -i openh264 | tee -a gh-out/g30diag.txt
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > ~/.asoundrc
          cat ~/.asoundrc | tee -a gh-out/g30diag.txt
          true
      - name: Login + stub movies observe
        env:
          PW_B64: VG1wI2VlWWhuQmRsQg==
        run: |
          set +u
          export GAME_PW
          GAME_PW=$(echo "$PW_B64" | base64 -d)
          cat > /tmp/run.sh <<'EOF'
          #!/bin/bash
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p $XDG_RUNTIME_DIR
          unset VK_ICD_FILENAMES
          cd /tmp/hero/Client
          R=$(find /tmp/rf -name ruffle -type f | head -1)
          echo "R:$R" > /tmp/prog.txt
          [ -n "$R" ] && [ -x "$R" ] || { echo NO_RUFFLE_ABORT >> /tmp/prog.txt; exit 3; }
          command -v scrot >/dev/null || { echo NO_SCROT_ABORT >> /tmp/prog.txt; exit 3; }
          command -v xdotool >/dev/null || { echo NO_XDOTOOL_ABORT >> /tmp/prog.txt; exit 3; }
          echo boot >> /tmp/prog.txt
          "$R" -p low --width 1012 --height 670 --tcp-connections allow --socket-allow 202.189.23.31:1800 --open-url-mode allow --filesystem-access-mode allow Client.swf > /tmp/ruffle.log 2>&1 &
          RPID=$!
          sleep 30; scrot /tmp/g30_t0.png
          SZ0=$(stat -c%s /tmp/g30_t0.png); echo "t0_bytes:$SZ0" >> /tmp/prog.txt
          W=$(xdotool search --name "uffle" | head -1)
          echo "W:$W" >> /tmp/prog.txt
          [ -n "$W" ] || { echo NO_WINDOW_ABORT >> /tmp/prog.txt; kill $RPID 2>/dev/null; exit 4; }
          xdotool windowfocus --sync "$W" 2>/dev/null || true
          if [ "$SZ0" -gt 500000 ]; then xdotool mousemove 570 573 click 1; echo splash_clicked >> /tmp/prog.txt; fi
          sleep 12; scrot /tmp/g30_t1.png
          SZ1=$(stat -c%s /tmp/g30_t1.png); echo "t1_bytes:$SZ1" >> /tmp/prog.txt
          if [ "$SZ1" -gt 500000 ]; then xdotool mousemove 570 573 click 1; sleep 12; scrot /tmp/g30_t1.png; SZ1=$(stat -c%s /tmp/g30_t1.png); echo "t1b_bytes:$SZ1" >> /tmp/prog.txt; fi
          xdotool windowfocus --sync "$W" 2>/dev/null || true
          xdotool mousemove 700 460 click 1; echo early_allow >> /tmp/prog.txt
          sleep 5; scrot /tmp/g30_t1b.png
          echo "t1b2_bytes:$(stat -c%s /tmp/g30_t1b.png)" >> /tmp/prog.txt
          cp /tmp/g30_t1b.png /tmp/acc_base.png
          for i in 1 2 3; do
            xdotool mousemove 560 196 click 1; sleep 2
            xdotool key --delay 40 BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace; sleep 2
            xdotool type --delay 120 "116031"; sleep 8
            scrot /tmp/g30_t2.png
            A=$(stat -c%s /tmp/acc_base.png); B=$(stat -c%s /tmp/g30_t2.png)
            echo "acc_try$i:$A->$B" >> /tmp/prog.txt
            cp /tmp/g30_t2.png /tmp/acc_base.png
            [ "$A" != "$B" ] && break
          done
          cp /tmp/g30_t2.png /tmp/pw_base.png
          for i in 1 2 3; do
            xdotool mousemove 560 238 click 1; sleep 2
            xdotool key --delay 40 BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace; sleep 2
            xdotool type --delay 120 "$GAME_PW"; sleep 8
            scrot /tmp/g30_t3.png
            A=$(stat -c%s /tmp/pw_base.png); B=$(stat -c%s /tmp/g30_t3.png)
            echo "pw_try$i:$A->$B" >> /tmp/prog.txt
            cp /tmp/g30_t3.png /tmp/pw_base.png
            [ "$A" != "$B" ] && break
          done
          xdotool mousemove 700 460 click 1
          sleep 5
          xdotool mousemove 582 385 click 1
          echo submitted >> /tmp/prog.txt
          sleep 10; scrot /tmp/g30_w0.png
          echo "w0:$(stat -c%s /tmp/g30_w0.png)" >> /tmp/prog.txt
          xdotool mousemove 700 460 click 1
          echo joined >> /tmp/prog.txt
          sleep 10; scrot /tmp/g30_w1.png
          echo "w1:$(stat -c%s /tmp/g30_w1.png)" >> /tmp/prog.txt
          sleep 15; scrot /tmp/g30_w2.png
          echo "w2:$(stat -c%s /tmp/g30_w2.png)" >> /tmp/prog.txt
          for e in 0 1 2 3 4 5 6 7; do
            case $e in
              0) X=430;Y=355;; 1) X=255;Y=300;; 2) X=430;Y=355;; 3) X=722;Y=395;;
              4) X=470;Y=400;; 5) X=722;Y=395;; 6) X=890;Y=250;; 7) X=560;Y=400;;
            esac
            xdotool mousemove $X $Y click 1
            sleep 7; scrot /tmp/g30_e$e.png
            echo "e$e:$(stat -c%s /tmp/g30_e$e.png)" >> /tmp/prog.txt
          done
          sleep 10; scrot /tmp/g30_t4.png
          sleep 10; scrot /tmp/g30_t5.png
          echo done >> /tmp/prog.txt
          kill $RPID 2>/dev/null || true
          wait $RPID 2>/dev/null || true
          EOF
          chmod +x /tmp/run.sh
          timeout 280 xvfb-run -a -s "-screen 0 1280x900x24" /tmp/run.sh || echo "run_exit=$?" >> gh-out/g30diag.txt
          cp /tmp/g30_*.png /tmp/ruffle.log /tmp/prog.txt gh-out/ 2>/dev/null || true
          ls gh-out/ | head -40
          true
      - name: Push results
        if: always()
        run: |
          set +u
          git config user.name 'arena-agent'
          git config user.email 'arena-agent@local'
          git add gh-out/
          git commit -m 'game g30 results' || echo 'nothing to commit'
          git pull --rebase origin arena/01a0bfc0-arenahero || true
          for i in 1 2 3; do git push origin HEAD:arena/01a0bfc0-arenahero && break || sleep 5; done || true
          true
