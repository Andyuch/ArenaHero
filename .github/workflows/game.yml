name: game
on:
  push:
    branches: [arena/01a0bfc0-arenahero]
    paths: [.github/workflows/.trigger]
run-name: game g7
permissions:
  contents: write
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a0bfc0-arenahero
      - name: Clone full client
        run: |
          git clone --depth 1 https://github.com/RecTaoMee/RecTaoMee_Hero.git /tmp/hero 2>&1 | tail -1
          du -sh /tmp/hero 2>/dev/null | tee gh-out/g7diag.txt
      - name: Fetch ruffle
        run: |
          curl -sS -L --max-time 150 -o /tmp/ruffle.tgz "https://github.com/ruffle-rs/ruffle/releases/download/v0.6.0/ruffle-0.6.0-linux-x86_64.tar.gz" && echo ruffle_dl_ok >> gh-out/g7diag.txt || echo ruffle_dl_fail >> gh-out/g7diag.txt
          mkdir -p /tmp/rf && tar xzf /tmp/ruffle.tgz -C /tmp/rf
          sudo apt-get install -y libxkbcommon-x11-0 scrot xdotool fonts-noto-cjk mesa-vulkan-drivers 2>&1 | tail -1
      - name: Login attempt
        env:
          PW_B64: VG1wI2VlWWhuQmRsQg==
        run: |
          set -u
          export GAME_PW
          GAME_PW=$(echo "$PW_B64" | base64 -d)
          cat > /tmp/run.sh <<'EOF'
          #!/bin/bash
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p $XDG_RUNTIME_DIR
          unset VK_ICD_FILENAMES
          cd /tmp/hero/Client
          R=$(find /tmp/rf -name ruffle -type f | head -1)
          "$R" -p low --width 1012 --height 670 Client.swf > /tmp/ruffle.log 2>&1 &
          RPID=$!
          sleep 30; scrot /tmp/g7_s0_title.png
          W=$(xdotool search --name "uffle" | head -1)
          xdotool windowactivate "$W" 2>/dev/null || true
          sleep 1
          xdotool mousemove 450 548 click 1
          sleep 25; scrot /tmp/g7_s1_afterstart.png
          xdotool type --delay 90 "116031"
          sleep 1
          xdotool key Tab
          sleep 1
          xdotool type --delay 90 "$GAME_PW"
          sleep 1
          scrot /tmp/g7_s2_typed.png
          xdotool key Return
          sleep 15; scrot /tmp/g7_s3_submit.png
          sleep 20; scrot /tmp/g7_s4_final.png
          kill $RPID 2>/dev/null
          wait 2>/dev/null
          EOF
          chmod +x /tmp/run.sh
          timeout 300 xvfb-run -a -s "-screen 0 1280x900x24" /tmp/run.sh
          echo "xvfb_exit=$?" >> gh-out/g7diag.txt
          cp /tmp/g7_*.png /tmp/ruffle.log gh-out/ 2>/dev/null || true
          ls -la gh-out/ | head -20
      - name: Push results
        if: always()
        run: |
          set -u
          git config user.name 'arena-agent'
          git config user.email 'arena-agent@local'
          git add gh-out/
          git commit -m 'game g7 results' || echo 'nothing to commit'
          git pull --rebase origin arena/01a0bfc0-arenahero || true
          git push origin HEAD:arena/01a0bfc0-arenahero
