name: game
on:
  push:
    branches: [arena/01a0bfc0-arenahero]
    paths: [.github/workflows/.trigger]
run-name: game g10
permissions:
  contents: write
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a0bfc0-arenahero
      - name: Clone full client
        run: |
          git clone --depth 1 https://github.com/RecTaoMee/RecTaoMee_Hero.git /tmp/hero 2>&1 | tail -1
          du -sh /tmp/hero 2>/dev/null | tee gh-out/g10diag.txt
          true
      - name: Fetch ruffle
        run: |
          curl -sS -L --max-time 150 -o /tmp/ruffle.tgz "https://github.com/ruffle-rs/ruffle/releases/download/v0.6.0/ruffle-0.6.0-linux-x86_64.tar.gz" && echo ruffle_dl_ok >> gh-out/g10diag.txt || echo ruffle_dl_fail >> gh-out/g10diag.txt
          mkdir -p /tmp/rf && tar xzf /tmp/ruffle.tgz -C /tmp/rf
          sudo apt-get install -y libxkbcommon-x11-0 scrot xdotool fonts-noto-cjk mesa-vulkan-drivers 2>&1 | tail -1
          true
      - name: Login direct inject
        env:
          PW_B64: VG1wI2VlWWhuQmRsQg==
        run: |
          set +u
          export GAME_PW
          GAME_PW=$(echo "$PW_B64" | base64 -d)
          cat > /tmp/run.sh <<'EOF'
          #!/bin/bash
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p $XDG_RUNTIME_DIR
          unset VK_ICD_FILENAMES
          cd /tmp/hero/Client
          R=$(find /tmp/rf -name ruffle -type f | head -1)
          echo "boot ruffle=$R" > /tmp/prog.txt
          "$R" -p low --width 1012 --height 670 Client.swf > /tmp/ruffle.log 2>&1 &
          RPID=$!
          sleep 30; scrot /tmp/g10_t0.png; echo "t0:$?" >> /tmp/prog.txt
          W=$(xdotool search --name "uffle" | head -1); echo "W=$W" >> /tmp/prog.txt
          xdotool windowfocus --sync "$W" 2>>/tmp/prog.txt || echo focus_fail >> /tmp/prog.txt
          echo "focus_is=$(xdotool getwindowfocus 2>&1)" >> /tmp/prog.txt
          sleep 1
          xdotool mousemove 450 548 click 1; echo clicked_start >> /tmp/prog.txt
          sleep 25; scrot /tmp/g10_t1.png; echo t1 >> /tmp/prog.txt
          xdotool mousemove 588 221 click 1; sleep 1
          xdotool type --window "$W" --delay 90 "116031"; echo "typed_acc:$?" >> /tmp/prog.txt
          sleep 1; scrot /tmp/g10_t2.png
          xdotool mousemove 588 261 click 1; sleep 1
          xdotool type --window "$W" --delay 90 "$GAME_PW"; echo "typed_pw:$?" >> /tmp/prog.txt
          sleep 1; scrot /tmp/g10_t3.png
          xdotool mousemove 587 386 click 1; echo clicked_login >> /tmp/prog.txt
          sleep 15; scrot /tmp/g10_t4.png
          sleep 20; scrot /tmp/g10_t5.png
          sleep 20; scrot /tmp/g10_t6.png
          ps aux | head -25 > /tmp/procs.txt || true
          kill $RPID 2>/dev/null || true
          wait $RPID 2>/dev/null || true
          echo done >> /tmp/prog.txt
          EOF
          chmod +x /tmp/run.sh
          timeout 280 xvfb-run -a -s "-screen 0 1280x900x24" /tmp/run.sh || echo "run_exit=$?" >> gh-out/g10diag.txt
          cp /tmp/g10_*.png /tmp/ruffle.log /tmp/prog.txt /tmp/procs.txt gh-out/ 2>/dev/null || true
          ls gh-out/ | head -25
          true
      - name: Push results
        if: always()
        run: |
          set +u
          git config user.name 'arena-agent'
          git config user.email 'arena-agent@local'
          git add gh-out/
          git commit -m 'game g10 results' || echo 'nothing to commit'
          git pull --rebase origin arena/01a0bfc0-arenahero || true
          for i in 1 2 3; do git push origin HEAD:arena/01a0bfc0-arenahero && break || sleep 5; done || true
          true
