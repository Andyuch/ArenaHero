name: game
on:
  push:
    branches: [arena/01a0bfc0-arenahero]
    paths: [.github/workflows/.trigger]
run-name: game g15
permissions:
  contents: write
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a0bfc0-arenahero
      - name: Clone full client
        run: |
          git clone --depth 1 https://github.com/RecTaoMee/RecTaoMee_Hero.git /tmp/hero 2>&1 | tail -1 || (sleep 15; git clone --depth 1 https://github.com/RecTaoMee/RecTaoMee_Hero.git /tmp/hero 2>&1 | tail -1)
          du -sh /tmp/hero 2>/dev/null | tee gh-out/g15diag.txt
          true
      - name: Fetch ruffle
        run: |
          for i in 1 2 3; do
            curl -sS -L --fail --max-time 150 -o /tmp/ruffle.tgz "https://github.com/ruffle-rs/ruffle/releases/download/v0.6.0/ruffle-0.6.0-linux-x86_64.tar.gz" && break || sleep 10
          done
          ls -la /tmp/ruffle.tgz 2>&1 | tee -a gh-out/g15diag.txt
          mkdir -p /tmp/rf && tar xzf /tmp/ruffle.tgz -C /tmp/rf 2>&1 | tail -2 | tee -a gh-out/g15diag.txt
          find /tmp/rf -name ruffle -type f 2>&1 | tee -a gh-out/g15diag.txt
          sudo apt-get install -y libxkbcommon-x11-0 scrot xdotool fonts-noto-cjk mesa-vulkan-drivers 2>&1 | tail -2 || (sleep 20; sudo apt-get install -y libxkbcommon-x11-0 scrot xdotool fonts-noto-cjk mesa-vulkan-drivers 2>&1 | tail -2)
          (which scrot; which xdotool) 2>&1 | tee -a gh-out/g15diag.txt
          true
      - name: Login + allow network prompt
        env:
          PW_B64: VG1wI2VlWWhuQmRsQg==
        run: |
          set +u
          export GAME_PW
          GAME_PW=$(echo "$PW_B64" | base64 -d)
          cat > /tmp/run.sh <<'EOF'
          #!/bin/bash
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p $XDG_RUNTIME_DIR
          unset VK_ICD_FILENAMES
          cd /tmp/hero/Client
          R=$(find /tmp/rf -name ruffle -type f | head -1)
          echo "R:$R" > /tmp/prog.txt
          [ -n "$R" ] && [ -x "$R" ] || { echo NO_RUFFLE_ABORT >> /tmp/prog.txt; exit 3; }
          command -v scrot >/dev/null || { echo NO_SCROT_ABORT >> /tmp/prog.txt; exit 3; }
          command -v xdotool >/dev/null || { echo NO_XDOTOOL_ABORT >> /tmp/prog.txt; exit 3; }
          echo boot >> /tmp/prog.txt
          "$R" -p low --width 1012 --height 670 Client.swf > /tmp/ruffle.log 2>&1 &
          RPID=$!
          sleep 30; scrot /tmp/g15_t0.png
          SZ0=$(stat -c%s /tmp/g15_t0.png); echo "t0_bytes:$SZ0" >> /tmp/prog.txt
          W=$(xdotool search --name "uffle" | head -1)
          echo "W:$W" >> /tmp/prog.txt
          [ -n "$W" ] || { echo NO_WINDOW_ABORT >> /tmp/prog.txt; kill $RPID 2>/dev/null; exit 4; }
          xdotool windowfocus --sync "$W" 2>/dev/null || true
          if [ "$SZ0" -gt 500000 ]; then xdotool mousemove 570 573 click 1; echo splash_clicked >> /tmp/prog.txt; fi
          sleep 12; scrot /tmp/g15_t1.png
          SZ1=$(stat -c%s /tmp/g15_t1.png); echo "t1_bytes:$SZ1" >> /tmp/prog.txt
          if [ "$SZ1" -gt 500000 ]; then xdotool mousemove 570 573 click 1; sleep 12; scrot /tmp/g15_t1.png; SZ1=$(stat -c%s /tmp/g15_t1.png); echo "t1b_bytes:$SZ1" >> /tmp/prog.txt; fi
          xdotool windowfocus --sync "$W" 2>/dev/null || true
          xdotool mousemove 700 460 click 1; echo early_allow >> /tmp/prog.txt
          sleep 5; scrot /tmp/g15_t1b.png
          echo "t1b2_bytes:$(stat -c%s /tmp/g15_t1b.png)" >> /tmp/prog.txt
          cp /tmp/g15_t1b.png /tmp/acc_base.png
          for i in 1 2 3; do
            xdotool mousemove 560 196 click 1; sleep 2
            xdotool key --delay 40 BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace; sleep 2
            xdotool type --delay 120 "116031"; sleep 8
            scrot /tmp/g15_t2.png
            A=$(stat -c%s /tmp/acc_base.png); B=$(stat -c%s /tmp/g15_t2.png)
            echo "acc_try$i:$A->$B" >> /tmp/prog.txt
            cp /tmp/g15_t2.png /tmp/acc_base.png
            [ "$A" != "$B" ] && break
          done
          cp /tmp/g15_t2.png /tmp/pw_base.png
          for i in 1 2 3; do
            xdotool mousemove 560 238 click 1; sleep 2
            xdotool key --delay 40 BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace BackSpace; sleep 2
            xdotool type --delay 120 "$GAME_PW"; sleep 8
            scrot /tmp/g15_t3.png
            A=$(stat -c%s /tmp/pw_base.png); B=$(stat -c%s /tmp/g15_t3.png)
            echo "pw_try$i:$A->$B" >> /tmp/prog.txt
            cp /tmp/g15_t3.png /tmp/pw_base.png
            [ "$A" != "$B" ] && break
          done
          xdotool mousemove 700 460 click 1
          sleep 5
          xdotool mousemove 582 385 click 1
          echo submitted >> /tmp/prog.txt
          sleep 5
          for w in 0 1 2 3 4 5; do
            xdotool mousemove 700 460 click 1; sleep 8; scrot /tmp/g15_w$w.png
            echo "w$w:$(stat -c%s /tmp/g15_w$w.png)" >> /tmp/prog.txt
          done
          scrot /tmp/g15_t4.png
          sleep 12; scrot /tmp/g15_t5.png
          sleep 15; scrot /tmp/g15_t6.png
          echo done >> /tmp/prog.txt
          kill $RPID 2>/dev/null || true
          wait $RPID 2>/dev/null || true
          EOF
          chmod +x /tmp/run.sh
          timeout 280 xvfb-run -a -s "-screen 0 1280x900x24" /tmp/run.sh || echo "run_exit=$?" >> gh-out/g15diag.txt
          cp /tmp/g15_*.png /tmp/ruffle.log /tmp/prog.txt gh-out/ 2>/dev/null || true
          ls gh-out/ | head -30
          true
      - name: Push results
        if: always()
        run: |
          set +u
          git config user.name 'arena-agent'
          git config user.email 'arena-agent@local'
          git add gh-out/
          git commit -m 'game g15 results' || echo 'nothing to commit'
          git pull --rebase origin arena/01a0bfc0-arenahero || true
          for i in 1 2 3; do git push origin HEAD:arena/01a0bfc0-arenahero && break || sleep 5; done || true
          true
