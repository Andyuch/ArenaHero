name: game
on:
  push:
    branches: [arena/01a0bfc0-arenahero]
    paths: [.github/workflows/.trigger]
run-name: game g4
permissions:
  contents: write
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a0bfc0-arenahero
      - name: Fetch bits
        run: |
          set -u
          mkdir -p gh-out/client/config gh-out/client/version
          cd gh-out/client
          curl -sS -L --max-time 90 -o Client.swf "https://raw.githubusercontent.com/RecTaoMee/RecTaoMee_Hero/master/Client/Client.swf" && echo "swf_bytes=$(wc -c < Client.swf)" >> ../g4diag.txt || echo "swf_FAIL" >> ../g4diag.txt
          for f in config/IP.xml config/System.xml index.htm version/config.txt crossdomain.xml; do
            mkdir -p "$(dirname "$f")"
            curl -sS -L --max-time 30 -o "$f" "https://raw.githubusercontent.com/RecTaoMee/RecTaoMee_Hero/master/Client/$f" && echo "$f OK" >> ../g4diag.txt || echo "$f FAIL" >> ../g4diag.txt
          done
          curl -sS -L --max-time 150 -o /tmp/ruffle.tgz "https://github.com/ruffle-rs/ruffle/releases/download/v0.6.0/ruffle-0.6.0-linux-x86_64.tar.gz" && echo ruffle_dl_ok >> ../g4diag.txt || echo ruffle_dl_fail >> ../g4diag.txt
          mkdir -p /tmp/rf && tar xzf /tmp/ruffle.tgz -C /tmp/rf
          R=$(find /tmp/rf -name ruffle -type f | head -1)
          echo "ruffle_bin=$R" >> ../g4diag.txt
          sudo apt-get install -y libxkbcommon-x11-0 scrot xdotool fonts-noto-cjk mesa-vulkan-drivers vulkan-tools 2>&1 | tail -1
          echo "--- vulkaninfo summary ---" >> ../g4diag.txt
          vulkaninfo --summary >> ../g4diag.txt 2>&1 || echo "vulkaninfo_fail" >> ../g4diag.txt
          echo "--- ruffle help ---" >> ../g4diag.txt
          "$R" --help >> ../g4diag.txt 2>&1 || true
      - name: Render test
        run: |
          set -u
          cd "$GITHUB_WORKSPACE/gh-out/client"
          cat > /tmp/run.sh <<'EOF'
          #!/bin/bash
          export LIBGL_ALWAYS_SOFTWARE=1
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          R=$(find /tmp/rf -name ruffle -type f | head -1)
          echo "attempt1: default backend" >> /tmp/att.txt
          "$R" --width 1012 --height 670 Client.swf > /tmp/ruffle1.log 2>&1 &
          RPID=$!
          sleep 25; scrot /tmp/g4_shot1.png
          sleep 15; scrot /tmp/g4_shot2.png
          kill $RPID 2>/dev/null; wait 2>/dev/null
          echo "attempt2: gl backend" >> /tmp/att.txt
          "$R" --graphics gl --width 1012 --height 670 Client.swf > /tmp/ruffle2.log 2>&1 &
          RPID=$!
          sleep 25; scrot /tmp/g4_shot3.png
          sleep 15; scrot /tmp/g4_shot4.png
          kill $RPID 2>/dev/null; wait 2>/dev/null
          EOF
          chmod +x /tmp/run.sh
          timeout 150 xvfb-run -a -s "-screen 0 1280x900x24" /tmp/run.sh
          echo "xvfb_exit=$?" >> ../g4diag.txt
          cp /tmp/g4_shot*.png /tmp/ruffle1.log /tmp/ruffle2.log ../ 2>/dev/null || true
          ls -la ../ | head -20
      - name: Push results
        if: always()
        run: |
          set -u
          git config user.name 'arena-agent'
          git config user.email 'arena-agent@local'
          git add gh-out/
          git commit -m 'game g4 results' || echo 'nothing to commit'
          git pull --rebase origin arena/01a0bfc0-arenahero || true
          git push origin HEAD:arena/01a0bfc0-arenahero
