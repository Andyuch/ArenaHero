name: game
on:
  push:
    branches: [arena/01a0bfc0-arenahero]
    paths: [.github/workflows/.trigger]
run-name: game g5
permissions:
  contents: write
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a0bfc0-arenahero
      - name: Fetch bits
        run: |
          set -u
          mkdir -p gh-out/client/config gh-out/client/version
          cd gh-out/client
          curl -sS -L --max-time 90 -o Client.swf "https://raw.githubusercontent.com/RecTaoMee/RecTaoMee_Hero/master/Client/Client.swf" && echo "swf_bytes=$(wc -c < Client.swf)" >> ../g5diag.txt || echo "swf_FAIL" >> ../g5diag.txt
          for f in config/IP.xml config/System.xml index.htm version/config.txt crossdomain.xml; do
            mkdir -p "$(dirname "$f")"
            curl -sS -L --max-time 30 -o "$f" "https://raw.githubusercontent.com/RecTaoMee/RecTaoMee_Hero/master/Client/$f" && echo "$f OK" >> ../g5diag.txt || echo "$f FAIL" >> ../g5diag.txt
          done
          curl -sS -L --max-time 150 -o /tmp/ruffle.tgz "https://github.com/ruffle-rs/ruffle/releases/download/v0.6.0/ruffle-0.6.0-linux-x86_64.tar.gz" && echo ruffle_dl_ok >> ../g5diag.txt || echo ruffle_dl_fail >> ../g5diag.txt
          mkdir -p /tmp/rf && tar xzf /tmp/ruffle.tgz -C /tmp/rf
          echo "ruffle_bin=$(find /tmp/rf -name ruffle -type f | head -1)" >> ../g5diag.txt
          sudo apt-get install -y libxkbcommon-x11-0 scrot xdotool fonts-noto-cjk mesa-vulkan-drivers 2>&1 | tail -1
          ls /usr/share/vulkan/icd.d/ >> ../g5diag.txt 2>&1
      - name: Render test
        run: |
          set -u
          cd "$GITHUB_WORKSPACE/gh-out/client"
          cat > /tmp/run.sh <<'EOF'
          #!/bin/bash
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p $XDG_RUNTIME_DIR
          unset VK_ICD_FILENAMES
          R=$(find /tmp/rf -name ruffle -type f | head -1)
          "$R" -p low --graphics vulkan --width 1012 --height 670 Client.swf > /tmp/r1.log 2>&1 &
          RPID=$!
          sleep 25; scrot /tmp/g5_shot1.png
          sleep 15; scrot /tmp/g5_shot2.png
          kill $RPID 2>/dev/null; wait 2>/dev/null
          "$R" -p low --width 1012 --height 670 Client.swf > /tmp/r2.log 2>&1 &
          RPID=$!
          sleep 25; scrot /tmp/g5_shot3.png
          sleep 15; scrot /tmp/g5_shot4.png
          kill $RPID 2>/dev/null; wait 2>/dev/null
          "$R" -p low --graphics gl --width 1012 --height 670 Client.swf > /tmp/r3.log 2>&1 &
          RPID=$!
          sleep 25; scrot /tmp/g5_shot5.png
          sleep 15; scrot /tmp/g5_shot6.png
          kill $RPID 2>/dev/null; wait 2>/dev/null
          EOF
          chmod +x /tmp/run.sh
          timeout 200 xvfb-run -a -s "-screen 0 1280x900x24" /tmp/run.sh
          echo "xvfb_exit=$?" >> ../g5diag.txt
          cp /tmp/g5_shot*.png /tmp/r1.log /tmp/r2.log /tmp/r3.log ../ 2>/dev/null || true
          ls -la ../ | head -20
      - name: Push results
        if: always()
        run: |
          set -u
          git config user.name 'arena-agent'
          git config user.email 'arena-agent@local'
          git add gh-out/
          git commit -m 'game g5 results' || echo 'nothing to commit'
          git pull --rebase origin arena/01a0bfc0-arenahero || true
          git push origin HEAD:arena/01a0bfc0-arenahero
